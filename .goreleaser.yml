version: 2

before:
  hooks:
    - go mod tidy
builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - arm64
      - amd64
      - "386"
    goarm:
      - "6"
    main: ./bin/ep.go
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.build={{.ShortCommit}}
archives:
  - id: default
checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
homebrew_casks:
  - repository:
      owner: paulnicholson
      name: homebrew-taps
      token: "{{ .Env.GORELEASER_TOKEN }}"
    homepage: "https://github.com/paulnicholson/envplate"
    description: "Docker-friendly trivial templating for config files using environment keys"
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/envplate"]
          end
